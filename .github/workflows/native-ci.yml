name: Native CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  changes:
    name: Detect CLI changes
    runs-on: ubuntu-latest
    outputs:
      cli: ${{ steps.filter.outputs.cli }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 2
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            cli:
              - 'cli/**'

  ubuntu-build:
    name: Ubuntu Native Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 2

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.26'

      - name: Install Hyperfine
        run: |
          sudo apt-get update
          sudo apt-get install -y hyperfine

      - name: Install wrk
        run: sudo apt-get install -y wrk

      - name: Run all modules (tests + coverage)
        run: make test-coverage

      - name: Run corpus benchmarks
        run: make benchmark-corpus

      - name: Collect coverage files
        id: coverage
        run: |
          mapfile -t files < <(find .artifacts/coverage -name '*.out' -type f | sort)
          if [ "${#files[@]}" -eq 0 ]; then
            echo "No coverage profiles generated" >&2
            exit 1
          fi
          (IFS=,; echo "files=${files[*]}" >> "$GITHUB_OUTPUT")

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v6
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ${{ steps.coverage.outputs.files }}
          flags: native
          fail_ci_if_error: true

      - name: Check gofmt
        run: |
          unformatted=$(gofmt -l -s .)
          if [ -n "$unformatted" ]; then
            echo "Unformatted Go files detected:"
            echo "$unformatted"
            exit 1
          fi

  windows-build:
    name: Windows Native Build
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 2

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.26'

      - name: Install test dependencies
        shell: pwsh
        run: |
          choco install hyperfine make -y

      - name: Run all modules
        shell: bash
        run: make test

  macos-build:
    name: macOS Native Build
    needs: changes
    if: needs.changes.outputs.cli == 'true'
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 2

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.26'

      - name: Run all modules
        run: python3 .github/scripts/run_native_tests.py
